[project]
name = "mojo-meshio"
version = "0.1.0"
description = "Mesh format I/O with Mojo geometry kernels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lee Penkman", email = "leepenkman@gmail.com" }]
dependencies = ["numpy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:overflow encountered in scalar multiply:RuntimeWarning:meshio.stl._stl",
    "ignore:VTK ASCII files are only meant for debugging:UserWarning",
]
